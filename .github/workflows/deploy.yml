name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.12.14.62
          username: agent
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/agent/projects/whisky-collection-shop
            git pull origin master
            npm ci --production=false
            npm run build
            pkill -f "next-server" || true
            sleep 2
            nohup npm start > /tmp/whisky-app.log 2>&1 &
            sleep 3
            curl -s -o /dev/null -w "Health: %{http_code}" http://localhost:3000
