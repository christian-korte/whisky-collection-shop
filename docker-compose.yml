version: '3.8'

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - CONTACT_EMAIL=${CONTACT_EMAIL:-info@christian-korte.com}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - NEXT_PUBLIC_SHOP_NAME=${NEXT_PUBLIC_SHOP_NAME:-Christians Whisky Sammlung}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
